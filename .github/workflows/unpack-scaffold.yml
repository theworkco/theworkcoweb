name: Unpack scaffold

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract scaffold into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf unpacked
          mkdir unpacked
          unzip -o theworkco-nextjs-scaffold.zip -d unpacked
          top_count=$(find unpacked -mindepth 1 -maxdepth 1 | wc -l)
          first=$(find unpacked -mindepth 1 -maxdepth 1 -print -quit)
          if [ "$top_count" -eq 1 ] && [ -d "$first" ]; then
            cp -a "$first"/. .
          else
            cp -a unpacked/. .
          fi
          rm -rf unpacked .codex-init
      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack Next.js scaffold"
          git push
